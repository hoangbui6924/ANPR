<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta author="Luc Thien Phong">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe</title>
</head>
<style>
    body {
        overflow: hidden;
        margin: 0;
        background: #050008;
    }

    #pad {
        position: fixed;
        right: 20px;
        bottom: 20px;
        display: grid;
        grid-template-columns: repeat(3, 48px);
        grid-template-rows: repeat(3, 48px);
        gap: 6px;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    #pad button {
        border: 1px solid rgba(255, 90, 220, 0.6);
        border-radius: 10px;
        background: rgba(80, 20, 90, 0.35);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        backdrop-filter: blur(4px);
    }

    #pad button:hover {
        background: rgba(255, 90, 220, 0.4);
    }

    #pad button:active {
        background: rgba(255, 90, 220, 0.7);
    }

    /* Controls stay hidden until the intro is started */
    #pad {
        opacity: 0;
        visibility: hidden;
        transition: opacity 1s ease 3s, visibility 0s linear 3s;
    }

    body.started #pad {
        opacity: 1;
        visibility: visible;
    }

    #intro {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: radial-gradient(circle at center, rgba(20, 0, 20, 0.2), rgba(5, 0, 8, 0.8));
        z-index: 10;
        transition: opacity 0.8s ease, visibility 0s linear 0.8s;
    }

    body.started #intro {
        opacity: 0;
        visibility: hidden;
    }

    #intro .card {
        max-width: 380px;
        width: 100%;
        padding: 32px 28px;
        text-align: center;
        color: #fff;
        font-family: sans-serif;
        border: 1px solid rgba(255, 90, 220, 0.45);
        border-radius: 18px;
        background: rgba(80, 20, 90, 0.2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 0 60px rgba(255, 90, 220, 0.25);
        transition: transform 0.8s ease;
    }

    body.started #intro .card {
        transform: translateY(-20px) scale(0.95);
    }

    #intro h1 {
        margin: 0 0 8px;
        font-size: 32px;
        letter-spacing: 6px;
        font-weight: 300;
    }

    #intro p {
        margin: 0 0 24px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        line-height: 1.6;
    }

    #startBtn {
        padding: 12px 40px;
        font-size: 16px;
        letter-spacing: 2px;
        color: #fff;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, rgb(255, 120, 60), rgb(255, 60, 200));
        box-shadow: 0 0 24px rgba(255, 90, 220, 0.6);
        cursor: pointer;
        animation: glow 2s ease-in-out infinite;
    }

    #startBtn:hover {
        transform: scale(1.05);
    }

    @keyframes glow {
        50% {
            box-shadow: 0 0 40px rgba(255, 90, 220, 0.95);
        }
    }
</style>

<body>
    <div id="pad">
        <button data-dir="pause" title="Dừng / tiếp tục xoay trái tim (P)">⏸</button>
        <button data-dir="up" title="Xoay lên (↑ / W)">↑</button>
        <span></span>
        <button data-dir="left" title="Xoay trái (← / A)">←</button>
        <button data-dir="reset" title="Đặt lại (R)">⟳</button>
        <button data-dir="right" title="Xoay phải (→ / D)">→</button>
        <span></span>
        <button data-dir="down" title="Xoay xuống (↓ / S)">↓</button>
        <span></span>
    </div>
    <div id="intro">
        <div class="card">
            <h1>UNIVERSE</h1>
            <p>Hàng trăm nghìn vì sao đang chờ được giải phóng.<br>Bấm để khai sinh thiên hà.</p>
            <button id="startBtn">BẮT ĐẦU</button>
        </div>
    </div>

    <!-- Star-portrait data (generated by tools/make-portrait.mjs); optional -->
    <script src="img/tkl.points.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { TrackballControls } from "three/addons/controls/TrackballControls.js";
        import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
        import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
        import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

        // ================= CUSTOMIZE =================
        // Ảnh tròn bay quanh (đường dẫn ảnh). Ảnh chỉ hiện khi mở qua web server
        // (vd. VS Code Live Server); mở trực tiếp file:// sẽ dùng emoji thay thế.
        const PHOTOS = [];
        const STICKER_EMOJIS = ["💖", "💌", "🌹", "💕", "🥰"];
        const EXPLODE_DURATION = 5; // giây
        const BLOOM_STRENGTH = 0.9;
        const SHOW_SMALL_HEARTS = true; // trái tim nhỏ bay quanh: đặt true để hiện lại
        // =============================================

        var defined = 'QXV0aG9yOiBMdWMg';
        var datacenter = ['aHR0cHM6L', 'y93d3cuZmF', 'jZWJvb2suY29t', 'L3Byb2ZpbGUu', 'cGhwP2lkPTEw', 'MDA0NTQwNj', 'I2MTQ5MQ' + '=='];
        defined = defined.concat('VGhpZW4gUGhvbmc=');
        console.log(atob(defined));
        console.log(atob(datacenter.join('')));

        // Raw colors everywhere (no sRGB conversion) so shader colors look as written
        THREE.ColorManagement.enabled = false;

        let scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050008);
        let camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
        camera.position.set(0, 12, 30);
        let renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        let composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        let bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), BLOOM_STRENGTH, 0.5, 0.15);
        composer.addPass(bloom);

        // Free 360° rotation in every direction, centered on the heart (scale + chest)
        const FOCUS = new THREE.Vector3(0, 8, 0);
        let controls = new TrackballControls(camera, renderer.domElement);
        controls.target.copy(FOCUS);
        controls.noRotate = true; // dragging rotates the model itself (see below), controls only zoom
        controls.zoomSpeed = 1.2;
        controls.noPan = true;
        controls.dynamicDampingFactor = 0.12;
        controls.minDistance = 3;
        controls.maxDistance = 90;
        controls.keys = [null, null, null]; // don't hijack A/S/D (used for rotation keys)
        controls.enabled = false; // locked until the intro is started
        controls.update();
        controls.target0.copy(controls.target);
        controls.position0.copy(camera.position);
        controls.up0.copy(camera.up);

        let gu = {
            time: { value: 0 },
            progress: { value: 0 }, // 0 = collapsed into the core, 1 = full scene
            scale: { value: innerHeight * renderer.getPixelRatio() / 2 }
        };

        window.addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            composer.setSize(innerWidth, innerHeight);
            gu.scale.value = innerHeight * renderer.getPixelRatio() / 2;
            controls.handleResize();
        });

        // ---------- helpers ----------
        let rand = (a, b) => a + Math.random() * (b - a);
        let gauss = () => {
            let u = 1 - Math.random(), v = Math.random();
            return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
        };
        let lerpColor = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

        class PointBuilder {
            constructor() { this.pos = []; this.col = []; this.size = []; this.shift = []; this.delay = []; this.normal = []; }
            add(x, y, z, c, size, delay, wobble, n = [0, 0, 0]) {
                this.pos.push(x, y, z);
                this.normal.push(n[0], n[1], n[2]);
                this.col.push(c[0], c[1], c[2]);
                this.size.push(size);
                this.delay.push(delay);
                this.shift.push(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI * 2,
                    (Math.random() * 0.9 + 0.1) * Math.PI * 0.1,
                    (Math.random() * 0.9 + 0.1) * wobble
                );
            }
            build(material) {
                let g = new THREE.BufferGeometry();
                g.setAttribute("position", new THREE.Float32BufferAttribute(this.pos, 3));
                g.setAttribute("aColor", new THREE.Float32BufferAttribute(this.col, 3));
                g.setAttribute("aSize", new THREE.Float32BufferAttribute(this.size, 1));
                g.setAttribute("aShift", new THREE.Float32BufferAttribute(this.shift, 4));
                g.setAttribute("aDelay", new THREE.Float32BufferAttribute(this.delay, 1));
                g.setAttribute("aNormal", new THREE.Float32BufferAttribute(this.normal, 3));
                return new THREE.Points(g, material);
            }
        }

        let pointVertex = `
            uniform float uTime;
            uniform float uProgress;
            uniform float uSize;
            uniform float uScale;
            uniform vec3 uCenter;
            uniform float uBeat;
            attribute vec3 aColor;
            attribute float aSize;
            attribute vec4 aShift;
            attribute float aDelay;
            attribute vec3 aNormal;
            varying vec3 vColor;
            varying float vK;
            void main() {
                // Surface points (non-zero normal) get lit: diffuse + rim, back side dimmed
                float shade = 1.;
                if (dot(aNormal, aNormal) > 0.25) {
                    vec3 n = normalize(normalMatrix * aNormal);
                    float diff = max(dot(n, normalize(vec3(0.4, 0.6, 1.))), 0.);
                    float rim = pow(1. - abs(n.z), 3.);
                    shade = (0.2 + 0.9 * diff + 0.9 * rim) * (n.z < 0. ? 0.3 : 1.);
                }

                vec3 p = uCenter + (position - uCenter) * uBeat;

                float moveT = mod(aShift.x + aShift.z * uTime, 6.2831853);
                float moveS = mod(aShift.y + aShift.z * uTime, 6.2831853);
                p += vec3(cos(moveS) * sin(moveT), cos(moveT), sin(moveS) * sin(moveT)) * aShift.w;

                // Explosion: each point flies out of the black hole along a spiral
                float k = clamp((uProgress - aDelay * 0.4) / 0.6, 0., 1.);
                k = 1. - pow(1. - k, 3.);
                float ang = (1. - k) * 4.;
                float ca = cos(ang), sa = sin(ang);
                p.xz = mat2(ca, -sa, sa, ca) * p.xz;
                p *= mix(0.015, 1., k);

                vec4 mv = modelViewMatrix * vec4(p, 1.);
                gl_PointSize = uSize * aSize * uScale / -mv.z;
                gl_Position = projectionMatrix * mv;
                vColor = aColor * shade;
                vK = k;
            }
        `;
        let pointFragment = `
            uniform float uOpacity;
            varying vec3 vColor;
            varying float vK;
            void main() {
                float d = length(gl_PointCoord - 0.5);
                if (d > 0.5) discard;
                float a = smoothstep(0.5, 0.0, d);
                gl_FragColor = vec4(vColor, a * a * uOpacity * mix(0.04, 1., vK));
            }
        `;
        let makePointMaterial = (size, opts = {}) => new THREE.ShaderMaterial({
            uniforms: {
                uTime: gu.time,
                uProgress: opts.progress || gu.progress,
                uScale: gu.scale,
                uSize: { value: size },
                uCenter: { value: opts.center || new THREE.Vector3() },
                uBeat: { value: 1 },
                uOpacity: { value: opts.opacity ?? 1 }
            },
            vertexShader: pointVertex,
            fragmentShader: pointFragment,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        // Everything the arrow keys / buttons rotate lives in this pivot
        // Rotation happens around the heart center (FOCUS) so it stays in view
        let pivot = new THREE.Group();
        pivot.position.copy(FOCUS);
        scene.add(pivot);
        let world = new THREE.Group();
        world.position.copy(FOCUS).negate();
        pivot.add(world);

        // ---------- background stars (always visible) ----------
        {
            let b = new PointBuilder();
            for (let i = 0; i < 6000; i++) {
                let v = new THREE.Vector3().randomDirection().multiplyScalar(rand(250, 500));
                let c = Math.random() < 0.8 ? [0.8, 0.8, 1] : [1, 0.7, 0.9];
                b.add(v.x, v.y, v.z, c.map(x => x * rand(0.3, 0.8)), rand(1, 3), 0, 0);
            }
            scene.add(b.build(makePointMaterial(1.6, { progress: { value: 1 } })));
        }

        // ---------- spiral galaxy ----------
        const GALAXY_R = 24;
        let galaxy;
        {
            let b = new PointBuilder();
            const ARMS = 3;
            const inner = [1.0, 0.72, 0.42], mid = [1.0, 0.32, 0.62], outer = [0.55, 0.3, 1.0];

            // spiral arms
            for (let i = 0; i < 70000; i++) {
                let arm = i % ARMS;
                let rr = Math.pow(Math.random(), 1.5);
                let r = 1.8 + rr * GALAXY_R;
                let a = arm / ARMS * Math.PI * 2 + r * 0.33;
                let sc = 0.3 + r * 0.07;
                let x = Math.cos(a) * r + gauss() * sc;
                let z = Math.sin(a) * r + gauss() * sc;
                let y = gauss() * (0.1 + 0.5 * Math.exp(-r / 5));
                let t = r / (GALAXY_R + 1.8);
                let c = t < 0.35 ? lerpColor(inner, mid, t / 0.35) : lerpColor(mid, outer, (t - 0.35) / 0.65);
                if (Math.random() < 0.05) c = [1, 0.95, 1];
                b.add(x, y, z, c.map(v => v * rand(0.5, 0.9)), rand(0.6, 1.8), Math.random(), 0.35);
            }
            // diffuse dust disk between the arms
            for (let i = 0; i < 45000; i++) {
                let r = 2 + Math.sqrt(Math.random()) * 38;
                let a = Math.random() * Math.PI * 2;
                let c = [[0.8, 0.6, 1], [1, 0.65, 0.9], [0.9, 0.9, 1]][i % 3];
                b.add(Math.cos(a) * r, gauss() * 0.25, Math.sin(a) * r, c.map(v => v * rand(0.15, 0.45)), rand(0.5, 1.5), Math.random(), 0.4);
            }
            // bright orange bulge around the black hole
            for (let i = 0; i < 8000; i++) {
                let r = 1.6 + Math.abs(gauss()) * 2.2;
                let a = Math.random() * Math.PI * 2;
                b.add(Math.cos(a) * r, gauss() * 0.2, Math.sin(a) * r, [1, 0.6, 0.3].map(v => v * rand(0.4, 0.8)), rand(0.6, 1.6), Math.random() * 0.5, 0.2);
            }
            galaxy = b.build(makePointMaterial(0.12));
            world.add(galaxy);
        }

        // ---------- particle heart ----------
        // True 3D heart surface: (x² + 9/4·y² + z² − 1)³ − x²z³ − 9/80·y²z³ = 0
        // (x = width, y = depth, z = up). Tip at z = −1.
        const HEART_S = 5.6, HEART_Y = 2 + HEART_S; // tip sits just above the black hole
        const HEART_SPIN = 0.4; // radians per second
        let heart;
        {
            let f = (x, y, z) => {
                let a = x * x + 2.25 * y * y + z * z - 1;
                return a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z;
            };
            let grad = (x, y, z) => {
                let a = x * x + 2.25 * y * y + z * z - 1, a2 = 3 * a * a, z2 = z * z, z3 = z2 * z;
                return [
                    a2 * 2 * x - 2 * x * z3,
                    a2 * 4.5 * y - 0.225 * y * z3,
                    a2 * 2 * z - 3 * x * x * z2 - 0.3375 * y * y * z2
                ];
            };
            // March from the center along a random direction to the surface, then bisect
            let surfaceAlong = d => {
                let lo = 0, hi = 0;
                for (let r = 0.02; r < 2; r += 0.02) {
                    if (f(d.x * r, d.y * r, d.z * r) > 0) { hi = r; break; }
                    lo = r;
                }
                for (let i = 0; i < 20; i++) {
                    let m = (lo + hi) / 2;
                    if (f(d.x * m, d.y * m, d.z * m) > 0) hi = m; else lo = m;
                }
                return lo;
            };

            let b = new PointBuilder();
            let d = new THREE.Vector3();
            for (let i = 0; i < 26000; i++) {
                d.randomDirection();
                let R = surfaceAlong(d);
                let shell = i < 19000;
                let r = shell ? R * (1 - Math.abs(gauss()) * 0.015) : R * Math.cbrt(Math.random()) * 0.92;
                let x = d.x * r, y = d.y * r, z = d.z * r;
                let n = [0, 0, 0], c;
                if (shell) {
                    let g = grad(x, y, z);
                    let len = Math.hypot(g[0], g[1], g[2]) || 1;
                    n = [g[0] / len, g[2] / len, g[1] / len]; // to world axes (x, up, depth)
                    c = Math.random() < 0.05 ? [1, 0.9, 1] : [1, 0.22, 0.88];
                } else {
                    c = [0.7, 0.12, 0.75].map(v => v * 0.35);
                }
                b.add(x * HEART_S, HEART_Y + z * HEART_S, y * HEART_S, c,
                    shell ? rand(0.9, 1.8) : rand(0.6, 1.3), rand(0.55, 1), 0.08, n);
            }
            heart = b.build(makePointMaterial(0.13, { center: new THREE.Vector3(0, HEART_Y, 0) }));
            world.add(heart);
        }

        // ---------- ornate golden Libra scale with a treasure chest, inside the heart ----------
        const BASE_Y = 4.3, PIVOT_Y = 10, PILLAR_TOP = 10.5, BEAM_L = 3.3, CHAIN_L = 2.5, PAN_R = 1.25;
        let beamGroup, pans = [], chestHit, chestGlow, libraParts = [];
        {
            let mat = makePointMaterial(0.1);
            let gold = s => [1, 0.78, 0.32].map(v => v * s);
            let goldLit = () => gold(rand(0.55, 0.85));
            let shine = () => [1, 0.92, 0.65].map(v => v * rand(0.8, 1));
            let P = (b, x, y, z, c, n, size = rand(0.7, 1.3)) => b.add(x, y, z, c, size, rand(0.75, 1), 0.02, n);

            // Surface of revolution from a smooth (r, y) profile, with normals and bright ridges
            let lathe = (b, profile, count, opts = {}) => {
                let pts = new THREE.SplineCurve(profile.map(([r, y]) => new THREE.Vector2(r, y))).getSpacedPoints(400);
                let w = [], total = 0;
                for (let i = 0; i < pts.length - 1; i++) {
                    let a = pts[i], c = pts[i + 1];
                    total += a.distanceTo(c) * ((a.x + c.x) / 2 + 0.05);
                    w.push(total);
                }
                let sign = opts.flip ? -1 : 1;
                for (let i = 0; i < count; i++) {
                    let r = Math.random() * total, j = 0;
                    while (w[j] < r) j++;
                    let a = pts[j], c = pts[j + 1], t = Math.random();
                    let rad = a.x + (c.x - a.x) * t, y = a.y + (c.y - a.y) * t;
                    let dr = c.x - a.x, dy = c.y - a.y, len = Math.hypot(dr, dy) || 1;
                    let nr = sign * dy / len, ny = -sign * dr / len;
                    let th = Math.random() * Math.PI * 2, ct = Math.cos(th), st = Math.sin(th);
                    P(b, ct * rad, y, st * rad, opts.color ? opts.color() : goldLit(), [ct * nr, ny, st * nr]);
                }
                // ridges = local maxima of the radius
                for (let i = 2; i < pts.length - 2; i++) {
                    if (pts[i].x > pts[i - 2].x + 1e-3 && pts[i].x > pts[i + 2].x + 1e-3 && pts[i].x >= pts[i - 1].x && pts[i].x >= pts[i + 1].x) {
                        let n = Math.round(60 + pts[i].x * 160);
                        for (let k = 0; k < n; k++) {
                            let th = Math.random() * Math.PI * 2;
                            P(b, Math.cos(th) * pts[i].x, pts[i].y, Math.sin(th) * pts[i].x, shine(), [Math.cos(th), 0, Math.sin(th)]);
                        }
                    }
                }
            };

            // Tube along a 3D curve (beam, scrolls)
            let tube = (b, points, radius, count, color = goldLit) => {
                let curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
                let p = new THREE.Vector3(), tg = new THREE.Vector3(), n1 = new THREE.Vector3(), n2 = new THREE.Vector3();
                let Z = new THREE.Vector3(0, 0, 1), Y = new THREE.Vector3(0, 1, 0);
                for (let i = 0; i < count; i++) {
                    let t = Math.random();
                    curve.getPointAt(t, p);
                    curve.getTangentAt(t, tg);
                    n1.crossVectors(tg, Math.abs(tg.z) > 0.9 ? Y : Z).normalize();
                    n2.crossVectors(tg, n1);
                    let a = Math.random() * Math.PI * 2;
                    let ox = n1.x * Math.cos(a) + n2.x * Math.sin(a);
                    let oy = n1.y * Math.cos(a) + n2.y * Math.sin(a);
                    let oz = n1.z * Math.cos(a) + n2.z * Math.sin(a);
                    let r = typeof radius === "function" ? radius(t) : radius;
                    P(b, p.x + ox * r, p.y + oy * r, p.z + oz * r, color(), [ox, oy, oz]);
                }
            };
            let spiral = (cx, cy, r0, a0, turns, shrink, dir, n = 40) => {
                let out = [];
                for (let i = 0; i <= n; i++) {
                    let s = i / n, a = a0 - dir * s * turns * Math.PI * 2, r = r0 * (1 - shrink * s);
                    out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r, 0]);
                }
                return out;
            };
            let ball = (b, cx, cy, cz, r, count, color = shine) => {
                let v = new THREE.Vector3();
                for (let i = 0; i < count; i++) {
                    v.randomDirection();
                    P(b, cx + v.x * r, cy + v.y * r, cz + v.z * r, color(), [v.x, v.y, v.z]);
                }
            };

            // ---- static part: bell base + baluster pillar + cup ----
            let s = new PointBuilder();
            const H = (PILLAR_TOP - BASE_Y) / 6.5;
            let baluster = [
                [1.05, 0], [1.08, 0.07], [1.0, 0.15], [0.88, 0.24], [0.7, 0.38], [0.52, 0.58], [0.42, 0.78],
                [0.54, 0.93], [0.56, 1.03], [0.38, 1.18], [0.28, 1.34], [0.4, 1.58], [0.48, 1.78], [0.43, 1.98],
                [0.26, 2.18], [0.36, 2.3], [0.2, 2.43], [0.14, 2.7], [0.12, 3.6], [0.11, 4.4], [0.2, 4.62],
                [0.25, 4.74], [0.13, 4.9], [0.1, 5.4], [0.1, 6.1], [0.14, 6.24], [0.3, 6.38], [0.44, 6.5]
            ].map(([r, y]) => [r, BASE_Y + y * H]);
            lathe(s, baluster, 9000);
            for (let i = 0; i < 700; i++) { // underside of the base
                let a = Math.random() * Math.PI * 2, p = 1.05 * Math.sqrt(Math.random());
                P(s, Math.cos(a) * p, BASE_Y, Math.sin(a) * p, gold(rand(0.25, 0.4)), [0, -1, 0]);
            }
            ball(s, 0, PIVOT_Y, 0, 0.2, 260);

            // ---- treasure chest on the cup ----
            const CW = 1.7, CH = 0.8, CD = 1.1, LR = CD / 2;
            const C_Y = PILLAR_TOP + CH / 2 + 0.02;
            let wood = () => [1, 0.62, 0.24].map(v => v * rand(0.85, 1.25)); // the chest glows
            let faces = [
                [CW * CH, () => [rand(-1, 1) * CW / 2, rand(-1, 1) * CH / 2, CD / 2]],
                [CW * CH, () => [rand(-1, 1) * CW / 2, rand(-1, 1) * CH / 2, -CD / 2]],
                [CD * CH, () => [CW / 2, rand(-1, 1) * CH / 2, rand(-1, 1) * CD / 2]],
                [CD * CH, () => [-CW / 2, rand(-1, 1) * CH / 2, rand(-1, 1) * CD / 2]],
                [CW * CD, () => [rand(-1, 1) * CW / 2, -CH / 2, rand(-1, 1) * CD / 2]]
            ];
            let totalArea = faces.reduce((a, f) => a + f[0], 0);
            for (let i = 0; i < 1800; i++) {
                let r = Math.random() * totalArea, f = faces[0];
                for (f of faces) { if ((r -= f[0]) <= 0) break; }
                let [x, y, z] = f[1]();
                P(s, x, C_Y + y, z, wood());
            }
            for (let i = 0; i < 1200; i++) {
                let a = Math.random() * Math.PI;
                P(s, rand(-1, 1) * CW / 2, C_Y + CH / 2 + Math.sin(a) * LR, Math.cos(a) * LR, wood());
            }
            for (let i = 0; i < 400; i++) { // lid end caps
                let a = Math.random() * Math.PI, p = LR * Math.sqrt(Math.random());
                P(s, (i % 2 ? 1 : -1) * CW / 2, C_Y + CH / 2 + Math.sin(a) * p, Math.cos(a) * p, wood());
            }
            let band = (a, c, count) => {
                for (let i = 0; i < count; i++) {
                    let t = Math.random();
                    P(s, a[0] + (c[0] - a[0]) * t, a[1] + (c[1] - a[1]) * t, a[2] + (c[2] - a[2]) * t, gold(1));
                }
            };
            for (let bx of [-CW * 0.32, CW * 0.32]) {
                band([bx, C_Y - CH / 2, CD / 2], [bx, C_Y + CH / 2, CD / 2], 120);
                band([bx, C_Y - CH / 2, -CD / 2], [bx, C_Y + CH / 2, -CD / 2], 120);
                for (let i = 0; i < 200; i++) {
                    let a = Math.random() * Math.PI;
                    P(s, bx, C_Y + CH / 2 + Math.sin(a) * LR, Math.cos(a) * LR, gold(1));
                }
            }
            band([-CW / 2, C_Y + CH / 2, CD / 2], [CW / 2, C_Y + CH / 2, CD / 2], 250);
            band([-CW / 2, C_Y + CH / 2, -CD / 2], [CW / 2, C_Y + CH / 2, -CD / 2], 250);
            ball(s, 0, C_Y + CH / 2 - 0.05, CD / 2 + 0.03, 0.12, 200, () => [1, 0.95, 0.7]); // lock
            for (let i = 0; i < 1000; i++) { // sparkles rising from the chest
                s.add(rand(-1, 1), C_Y + CH / 2 + LR + rand(-0.2, 1.8), rand(-0.7, 0.7),
                    [1, 0.92, 0.65].map(v => v * rand(0.7, 1.2)), rand(0.6, 1.8), rand(0.85, 1), 0.45);
            }
            let staticPart = s.build(mat);
            heart.add(staticPart);
            libraParts.push(staticPart);

            // pulsing golden halo around the chest
            let gc = document.createElement("canvas");
            gc.width = gc.height = 256;
            let gctx = gc.getContext("2d");
            let grd = gctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grd.addColorStop(0, "rgba(255,240,190,1)");
            grd.addColorStop(0.2, "rgba(255,200,90,0.75)");
            grd.addColorStop(0.5, "rgba(255,140,40,0.22)");
            grd.addColorStop(1, "rgba(0,0,0,0)");
            gctx.fillStyle = grd;
            gctx.fillRect(0, 0, 256, 256);
            chestGlow = new THREE.Sprite(new THREE.SpriteMaterial({
                map: new THREE.CanvasTexture(gc), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
            }));
            chestGlow.position.y = C_Y + 0.3;
            chestGlow.scale.setScalar(5);
            heart.add(chestGlow);

            // invisible, slightly larger box used to detect clicks on the chest
            chestHit = new THREE.Mesh(
                new THREE.BoxGeometry(CW + 0.6, CH + LR + 0.8, CD + 0.6),
                new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, colorWrite: false })
            );
            chestHit.position.y = PILLAR_TOP + (CH + LR) / 2 + 0.1;
            heart.add(chestHit);

            // ---- rocking beam: gentle arch, volute ends, C-scroll ornaments ----
            beamGroup = new THREE.Group();
            beamGroup.position.y = PIVOT_Y;
            heart.add(beamGroup);
            let bm = new PointBuilder();
            let beamY = x => 0.16 * Math.cos(x / BEAM_L * Math.PI / 2) - 0.06;
            let beamPts = [];
            for (let i = 0; i <= 16; i++) {
                let x = -BEAM_L + i / 16 * BEAM_L * 2;
                beamPts.push([x, beamY(x), 0]);
            }
            tube(bm, beamPts, t => 0.05 + 0.04 * (1 - Math.abs(t * 2 - 1)), 2600);
            const END_Y = beamY(BEAM_L), VR = 0.3;
            for (let side of [-1, 1]) {
                // volute curling from the beam end
                tube(bm, spiral(side * BEAM_L, END_Y - VR, VR, Math.PI / 2, 0.9, 0.65, side).map(([x, y]) => [x, y, 0]),
                    t => 0.045 * (1 - 0.5 * t), 500);
                // C-scrolls above and below the center
                tube(bm, [[side * 0.12, 0.12, 0], [side * 0.5, 0.42, 0], [side * 0.95, 0.5, 0], [side * 1.25, 0.34, 0],
                    [side * 1.18, 0.16, 0], [side * 1.02, 0.2, 0]], t => 0.04 * (1 - 0.4 * t), 600);
                tube(bm, [[side * 0.12, -0.08, 0], [side * 0.45, -0.32, 0], [side * 0.82, -0.34, 0], [side * 0.98, -0.2, 0],
                    [side * 0.88, -0.1, 0]], t => 0.035 * (1 - 0.4 * t), 400);
                ball(bm, side * 1.6, beamY(1.6) + 0.02, 0, 0.07, 80);
            }
            let beamPart = bm.build(mat);
            beamGroup.add(beamPart);
            libraParts.push(beamPart);

            // ---- pans: hook, beaded chains, shallow dish ----
            const HANG_Y = END_Y - VR * 2 + 0.05;
            for (let side of [-1, 1]) {
                let pan = new THREE.Group();
                pan.position.set(side * BEAM_L, HANG_Y, 0);
                beamGroup.add(pan);
                let pb = new PointBuilder();
                ball(pb, 0, 0, 0, 0.08, 80);
                for (let k = 0; k < 3; k++) {
                    let a = Math.PI / 2 + k * Math.PI * 2 / 3;
                    let ex = Math.cos(a) * PAN_R * 0.97, ez = Math.sin(a) * PAN_R * 0.97;
                    const BEADS = 26;
                    for (let i = 1; i <= BEADS; i++) {
                        let t = i / BEADS;
                        for (let q = 0; q < 6; q++) {
                            P(pb, ex * t + gauss() * 0.015, -CHAIN_L * t + gauss() * 0.015, ez * t + gauss() * 0.015,
                                shine(), [0, 0, 0], rand(0.6, 1));
                        }
                    }
                }
                let dish = [[0, -0.36], [0.25, -0.35], [0.6, -0.32], [0.95, -0.22], [1.15, -0.1], [1.25, 0], [1.3, 0.03]]
                    .map(([r, y]) => [r, -CHAIN_L + y]);
                lathe(pb, dish, 2200, { flip: true });
                lathe(pb, [[0, -CHAIN_L - 0.48], [0.14, -CHAIN_L - 0.46], [0.2, -CHAIN_L - 0.4], [0.16, -CHAIN_L - 0.35]], 150);
                let panPart = pb.build(mat);
                pan.add(panPart);
                libraParts.push(panPart);
                pans.push(pan);
            }
        }

        // ---------- decorations (black hole, texts, stickers, little hearts) ----------
        let decor = new THREE.Group();
        world.add(decor);

        let canvasTexture = canvas => {
            let tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 4;
            return tex;
        };

        // black hole
        {
            let hole = new THREE.Mesh(
                new THREE.SphereGeometry(1.1, 48, 48),
                new THREE.MeshBasicMaterial({ color: 0x000000 })
            );
            decor.add(hole);

            let disk = new THREE.Mesh(
                new THREE.RingGeometry(1.25, 4.2, 128, 1),
                new THREE.ShaderMaterial({
                    uniforms: { uTime: gu.time },
                    vertexShader: `
                        varying vec3 vPos;
                        void main() {
                            vPos = position;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.);
                        }
                    `,
                    fragmentShader: `
                        uniform float uTime;
                        varying vec3 vPos;
                        void main() {
                            float r = length(vPos.xy);
                            float t = (r - 1.25) / (4.2 - 1.25);
                            float ang = atan(vPos.y, vPos.x);
                            float swirl = 0.65 + 0.35 * sin(ang * 5. + r * 4. - uTime * 2.);
                            vec3 col = mix(vec3(1., 0.97, 0.8), vec3(1., 0.6, 0.15), smoothstep(0., 0.45, t));
                            col = mix(col, vec3(0.9, 0.2, 0.45), smoothstep(0.45, 1., t));
                            float a = smoothstep(0., 0.05, t) * (1. - smoothstep(0.2, 1., t)) * swirl;
                            gl_FragColor = vec4(col, a);
                        }
                    `,
                    transparent: true,
                    depthWrite: false,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending
                })
            );
            disk.rotation.x = -Math.PI / 2;
            decor.add(disk);

            let c = document.createElement("canvas");
            c.width = c.height = 256;
            let ctx = c.getContext("2d");
            let grd = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grd.addColorStop(0, "rgba(255,220,150,1)");
            grd.addColorStop(0.25, "rgba(255,150,70,0.6)");
            grd.addColorStop(0.6, "rgba(255,60,150,0.15)");
            grd.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, 256, 256);
            let glow = new THREE.Sprite(new THREE.SpriteMaterial({
                map: canvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
            }));
            glow.scale.setScalar(10);
            decor.add(glow);
        }

        // things that orbit around the center
        let orbiters = [];
        let addOrbiter = (sprite, r, y, angle, speed, bob) => {
            decor.add(sprite);
            orbiters.push({ sprite, r, y, angle, speed, bob, phase: Math.random() * Math.PI * 2 });
        };

        let stickerCanvas = draw => {
            let c = document.createElement("canvas");
            c.width = c.height = 256;
            let ctx = c.getContext("2d");
            ctx.save();
            ctx.beginPath();
            ctx.arc(128, 128, 116, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.clip();
            draw(ctx);
            ctx.restore();
            ctx.beginPath();
            ctx.arc(128, 128, 116, 0, Math.PI * 2);
            ctx.lineWidth = 8;
            ctx.strokeStyle = "#ff8ae6";
            ctx.stroke();
            return c;
        };
        let makeSticker = index => {
            let emoji = STICKER_EMOJIS[index % STICKER_EMOJIS.length];
            let c = stickerCanvas(ctx => {
                ctx.font = '130px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(emoji, 128, 140);
            });
            let tex = canvasTexture(c);
            let s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
            s.scale.setScalar(2.6);

            // Photos only work over http(s): file:// images taint the canvas for WebGL
            let photo = PHOTOS.length ? PHOTOS[index % PHOTOS.length] : null;
            if (photo && location.protocol !== "file:") {
                let img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    let pc = stickerCanvas(ctx => {
                        let m = Math.min(img.width, img.height);
                        ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 12, 12, 232, 232);
                    });
                    s.material.map = canvasTexture(pc);
                    s.material.needsUpdate = true;
                };
                img.src = photo;
            } else if (photo) {
                console.warn("Ảnh chỉ hiển thị khi mở trang qua web server (vd. Live Server).");
            }
            return s;
        };

        let makeHeartSprite = () => {
            let c = document.createElement("canvas");
            c.width = c.height = 128;
            let ctx = c.getContext("2d");
            let x = 64, y = 30, s = 72;
            ctx.shadowColor = "#ff3ddc";
            ctx.shadowBlur = 18;
            let grd = ctx.createLinearGradient(0, y, 0, y + s);
            grd.addColorStop(0, "#ff9bea");
            grd.addColorStop(1, "#ff2fa8");
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.moveTo(x, y + s / 4);
            ctx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s / 4);
            ctx.bezierCurveTo(x - s / 2, y + s / 2, x, y + s * 0.75, x, y + s);
            ctx.bezierCurveTo(x, y + s * 0.75, x + s / 2, y + s / 2, x + s / 2, y + s / 4);
            ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s / 4);
            ctx.fill();
            let sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: canvasTexture(c), transparent: true, depthWrite: false }));
            sp.scale.setScalar(rand(0.8, 1.5));
            return sp;
        };

        for (let i = 0; i < 6; i++) {
            addOrbiter(makeSticker(i), rand(9, 20), rand(1.5, 3.5), i / 6 * Math.PI * 2 + 0.5, 0.5, 0.4);
        }
        for (let i = 0; i < (SHOW_SMALL_HEARTS ? 14 : 0); i++) {
            addOrbiter(makeHeartSprite(), rand(5, 20), rand(1, 6), Math.random() * Math.PI * 2, 0.7, 0.8);
        }
        decor.scale.setScalar(0.001);

        // ---------- star portrait: click the chest -> the heart, scale and chest dots become the person ----------
        const PORTRAIT_HEIGHT = 20, PORTRAIT_LIFT = 2.5, MORPH_DURATION = 3.5;
        let portrait = null, morph = { value: 0 }, morphTarget = 0;
        let sources = [heart, ...libraParts]; // their dots are what flies into the portrait
        if (window.PORTRAIT) {
            let P = window.PORTRAIT, raw = Uint8Array.from(atob(P.data), c => c.charCodeAt(0));
            let n = sources.reduce((a, o) => a + o.geometry.attributes.position.count, 0);
            let k = PORTRAIT_HEIGHT / P.height;
            // shuffle target pixels so every source dot gets a random spot (repeats when there are more dots)
            let perm = Array.from({ length: P.count }, (_, i) => i);
            for (let i = perm.length - 1; i > 0; i--) {
                let j = (Math.random() * (i + 1)) | 0;
                [perm[i], perm[j]] = [perm[j], perm[i]];
            }
            let pos = new Float32Array(n * 3), col = new Float32Array(n * 3), srcCol = new Float32Array(n * 3);
            let side = new Float32Array(n * 3), sizeFrom = new Float32Array(n), sizeTo = new Float32Array(n), delay = new Float32Array(n);
            const dark = [0.32, 0.18, 0.55], light = [1, 0.78, 0.95]; // galaxy violet -> pale pink
            let v = new THREE.Vector3(), j = 0;
            for (let obj of sources) {
                let a = obj.geometry.attributes, srcSize = obj.material.uniforms.uSize.value;
                for (let i = 0; i < a.position.count; i++, j++) {
                    let o = perm[j % P.count] * 7, x = raw[o], y = raw[o + 1] | (raw[o + 2] << 8);
                    pos[j * 3] = (x - P.width / 2 + rand(-0.5, 0.5)) * k;
                    pos[j * 3 + 1] = (P.height / 2 - y + rand(-0.5, 0.5)) * k;
                    pos[j * 3 + 2] = 0; // flat, like a photo
                    // soft colors: brightness from the photo mapped onto the galaxy palette, a hint of the real hue
                    let r = raw[o + 4] / 255, g = raw[o + 5] / 255, b = raw[o + 6] / 255;
                    let lum = 0.3 * r + 0.59 * g + 0.11 * b;
                    let bottomFade = THREE.MathUtils.smoothstep((P.height - y) / P.height, 0, 0.18);
                    let real = [r, g, b];
                    for (let c = 0; c < 3; c++) {
                        let pal = dark[c] + (light[c] - dark[c]) * lum;
                        col[j * 3 + c] = (pal * 0.8 + real[c] * 0.2) * 0.65 * bottomFade;
                        srcCol[j * 3 + c] = a.aColor.array[i * 3 + c];
                    }
                    v.randomDirection();
                    side[j * 3] = v.x; side[j * 3 + 1] = v.y; side[j * 3 + 2] = v.z;
                    sizeFrom[j] = a.aSize.array[i] * srcSize;
                    sizeTo[j] = rand(0.8, 1.3) * 0.09;
                    delay[j] = Math.random();
                }
            }
            let geo = new THREE.BufferGeometry();
            geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
            geo.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
            geo.setAttribute("aSrcColor", new THREE.BufferAttribute(srcCol, 3));
            geo.setAttribute("aSide", new THREE.BufferAttribute(side, 3));
            geo.setAttribute("aSizeFrom", new THREE.BufferAttribute(sizeFrom, 1));
            geo.setAttribute("aSizeTo", new THREE.BufferAttribute(sizeTo, 1));
            geo.setAttribute("aDelay", new THREE.BufferAttribute(delay, 1));
            geo.setAttribute("aFrom", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
            portrait = new THREE.Points(geo, new THREE.ShaderMaterial({
                uniforms: {
                    uTime: gu.time,
                    uMorph: morph,
                    uScale: gu.scale,
                    uTo: { value: new THREE.Matrix4() }
                },
                vertexShader: `
                    uniform float uTime;
                    uniform float uMorph;
                    uniform float uScale;
                    uniform mat4 uTo;
                    attribute vec3 aColor;
                    attribute vec3 aSrcColor;
                    attribute vec3 aSide;
                    attribute vec3 aFrom;
                    attribute float aSizeFrom;
                    attribute float aSizeTo;
                    attribute float aDelay;
                    varying vec3 vColor;
                    void main() {
                        float k = clamp((uMorph - aDelay * 0.45) / 0.55, 0., 1.);
                        k = k * k * (3. - 2. * k);
                        vec3 local = position + vec3(sin(uTime * 0.7 + aDelay * 40.), cos(uTime * 0.6 + aDelay * 30.), 0.) * 0.03;
                        vec3 to = (uTo * vec4(local, 1.)).xyz;
                        // fly from its place in the heart / scale / chest to the portrait, swinging out on the way
                        vec3 p = mix(aFrom, to, k) + aSide * sin(k * 3.14159) * 3.;
                        vec4 mv = modelViewMatrix * vec4(p, 1.);
                        gl_PointSize = mix(aSizeFrom, aSizeTo, k) * uScale / -mv.z;
                        gl_Position = projectionMatrix * mv;
                        vColor = mix(aSrcColor, aColor, k);
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    void main() {
                        float d = length(gl_PointCoord - 0.5);
                        if (d > 0.5) discard;
                        float a = smoothstep(0.5, 0.0, d);
                        gl_FragColor = vec4(vColor, a * a);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            }));
            portrait.frustumCulled = false;
            portrait.visible = false;
            world.add(portrait); // part of the galaxy model: rotates with it
        }

        // Star fountain shooting up from the galaxy center while the portrait forms
        let fountain, fountainPower = 0;
        {
            const N = 9000;
            let dir = new Float32Array(N * 3), col = new Float32Array(N * 3), phase = new Float32Array(N), speed = new Float32Array(N);
            for (let i = 0; i < N; i++) {
                let a = Math.random() * Math.PI * 2, s = Math.sqrt(Math.random());
                dir[i * 3] = Math.cos(a) * s;
                dir[i * 3 + 1] = Math.random();
                dir[i * 3 + 2] = Math.sin(a) * s;
                let c = [[1, 0.85, 0.6], [1, 0.45, 0.85], [0.75, 0.6, 1], [1, 1, 1]][i % 4];
                col.set(c.map(x => x * rand(0.5, 0.9)), i * 3);
                phase[i] = Math.random();
                speed[i] = rand(0.25, 0.5);
            }
            let g = new THREE.BufferGeometry();
            g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(N * 3), 3));
            g.setAttribute("aDir", new THREE.BufferAttribute(dir, 3));
            g.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
            g.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
            g.setAttribute("aSpeed", new THREE.BufferAttribute(speed, 1));
            fountain = new THREE.Points(g, new THREE.ShaderMaterial({
                uniforms: { uClock: { value: 0 }, uPower: { value: 0 }, uScale: gu.scale },
                vertexShader: `
                    uniform float uClock;
                    uniform float uPower;
                    uniform float uScale;
                    attribute vec3 aDir;
                    attribute vec3 aColor;
                    attribute float aPhase;
                    attribute float aSpeed;
                    varying vec3 vColor;
                    varying float vA;
                    void main() {
                        float life = fract(uClock * aSpeed + aPhase);
                        float h = life * (12. + aDir.y * 8.);
                        float spread = 0.25 + life * (2.5 + aDir.y * 2.);
                        float swirl = life * 3. + aPhase * 6.2831853;
                        vec2 xz = mat2(cos(swirl), -sin(swirl), sin(swirl), cos(swirl)) * aDir.xz * spread;
                        vec3 p = vec3(xz.x, h - life * life * 4., xz.y);
                        vec4 mv = modelViewMatrix * vec4(p, 1.);
                        gl_PointSize = 0.13 * (1.4 - life) * uScale / -mv.z;
                        gl_Position = projectionMatrix * mv;
                        vColor = aColor;
                        vA = uPower * sin(life * 3.14159);
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying float vA;
                    void main() {
                        float d = length(gl_PointCoord - 0.5);
                        if (d > 0.5) discard;
                        float a = smoothstep(0.5, 0.0, d);
                        gl_FragColor = vec4(vColor, a * a * vA);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            }));
            fountain.frustumCulled = false;
            fountain.visible = false;
            world.add(fountain);
        }

        let beginMorph = () => {
            // snapshot where every heart / scale / chest dot is right now (in the model's own space)
            world.updateWorldMatrix(true, true);
            let toLocal = world.matrixWorld.clone().invert(), m = new THREE.Matrix4();
            let from = portrait.geometry.attributes.aFrom, v = new THREE.Vector3(), j = 0;
            for (let obj of sources) {
                m.multiplyMatrices(toLocal, obj.matrixWorld);
                let pa = obj.geometry.attributes.position;
                for (let i = 0; i < pa.count; i++, j++) {
                    v.fromBufferAttribute(pa, i).applyMatrix4(m);
                    from.setXYZ(j, v.x, v.y, v.z);
                }
            }
            from.needsUpdate = true;
            // the portrait faces the camera at click time, then belongs to the model
            let up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
            let M = new THREE.Matrix4().compose(controls.target.clone().addScaledVector(up, PORTRAIT_LIFT),
                camera.quaternion, new THREE.Vector3(1, 1, 1));
            portrait.material.uniforms.uTo.value.multiplyMatrices(toLocal, M);
        };
        let toggleMorph = () => {
            if (!portrait) {
                console.warn("Không tìm thấy dữ liệu ảnh (img/tkl.points.js). Chạy tools/make-portrait.mjs để tạo.");
                return;
            }
            if (gu.progress.value < 1) return; // wait until the galaxy has fully formed
            if (!morphTarget && morph.value <= 0) beginMorph();
            morphTarget = morphTarget ? 0 : 1;
        };

        // ---------- rotation by keys / buttons ----------
        const ROT_SPEED = 1.2; // radians per second
        const DRAG_SPEED = 0.006; // radians per pixel
        // Rotation axes follow the screen: drag/keys up-down tilt the model, left-right turn it
        let camRight = new THREE.Vector3(), camUp = new THREE.Vector3();
        let rotateModel = (pitch, yaw) => {
            camRight.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
            camUp.setFromMatrixColumn(camera.matrixWorld, 1).normalize();
            pivot.rotateOnWorldAxis(camRight, pitch);
            pivot.rotateOnWorldAxis(camUp, yaw);
        };
        let input = { up: false, down: false, left: false, right: false };
        let velX = 0, velY = 0;
        let spinPaused = false, spinFactor = 1, spinAngle = 0;
        let pauseBtn = document.querySelector("[data-dir=pause]");
        let togglePause = () => {
            spinPaused = !spinPaused;
            pauseBtn.textContent = spinPaused ? "▶" : "⏸";
        };

        let resetView = () => {
            pivot.quaternion.identity();
            velX = velY = 0;
            spinAngle = 0;
            controls.reset();
        };

        // Intro: "Bắt đầu" releases everything from the black hole
        let started = false;
        let start = () => {
            if (started) return;
            started = true;
            document.body.classList.add("started");
            controls.enabled = true;
        };
        document.getElementById("startBtn").addEventListener("click", start);

        const keyMap = {
            ArrowUp: "up", KeyW: "up",
            ArrowDown: "down", KeyS: "down",
            ArrowLeft: "left", KeyA: "left",
            ArrowRight: "right", KeyD: "right"
        };
        window.addEventListener("keydown", e => {
            if (!started) {
                if (e.code === "Enter" || e.code === "Space") start();
                return;
            }
            if (keyMap[e.code]) { input[keyMap[e.code]] = true; e.preventDefault(); }
            if (e.code === "KeyR") resetView();
            if (e.code === "KeyP") togglePause();
            if (e.code === "Escape" && morphTarget) toggleMorph();
        });
        window.addEventListener("keyup", e => {
            if (keyMap[e.code]) input[keyMap[e.code]] = false;
        });
        window.addEventListener("blur", () => {
            for (let k in input) input[k] = false;
        });

        // Grab-and-rotate the whole model with mouse / one finger (with inertia on release)
        let canvas = renderer.domElement;
        let pointers = new Map(), dragging = false, lastMove = 0, down = null;
        let raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
        let hitsChest = e => {
            if (!chestHit) return false;
            ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
            raycaster.setFromCamera(ndc, camera);
            return raycaster.intersectObject(chestHit).length > 0;
        };
        canvas.style.touchAction = "none";
        canvas.addEventListener("pointerdown", e => {
            if (!started) return;
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            dragging = pointers.size === 1;
            down = { x: e.clientX, y: e.clientY, t: performance.now() };
            velX = velY = 0;
            lastMove = performance.now();
            canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener("pointermove", e => {
            let p = pointers.get(e.pointerId);
            if (!p) {
                if (started && e.pointerType === "mouse") canvas.style.cursor = !morphTarget && hitsChest(e) ? "pointer" : "grab";
                return;
            }
            let dx = e.clientX - p.x, dy = e.clientY - p.y;
            p.x = e.clientX; p.y = e.clientY;
            if (!dragging || pointers.size !== 1) return;
            let now = performance.now(), mdt = Math.max((now - lastMove) / 1000, 1 / 240);
            lastMove = now;
            rotateModel(dy * DRAG_SPEED, dx * DRAG_SPEED);
            velX = THREE.MathUtils.clamp(dy * DRAG_SPEED / mdt, -8, 8);
            velY = THREE.MathUtils.clamp(dx * DRAG_SPEED / mdt, -8, 8);
        });
        let endPointer = e => {
            // a short tap without moving = click: chest -> portrait; any tap while it is shown -> back
            if (e.type === "pointerup" && down && pointers.size === 1 &&
                Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 500 &&
                (morphTarget || hitsChest(e))) {
                toggleMorph();
            }
            pointers.delete(e.pointerId);
            if (pointers.size === 0) {
                dragging = false;
                if (performance.now() - lastMove > 80) velX = velY = 0; // held still before release
            } else dragging = false; // pinch: zoom only
        };
        canvas.addEventListener("pointerup", endPointer);
        canvas.addEventListener("pointercancel", endPointer);

        document.querySelectorAll("#pad button").forEach(btn => {
            let dir = btn.dataset.dir;
            if (dir === "reset" || dir === "pause") {
                btn.addEventListener("click", dir === "reset" ? resetView : togglePause);
                return;
            }
            let on = e => { input[dir] = true; e.preventDefault(); };
            let off = () => { input[dir] = false; };
            btn.addEventListener("pointerdown", on);
            btn.addEventListener("pointerup", off);
            btn.addEventListener("pointerleave", off);
            btn.addEventListener("pointercancel", off);
        });

        // ---------- animation ----------
        let clock = new THREE.Clock();
        let lastT = 0;
        renderer.setAnimationLoop(() => {
            controls.update();
            let elapsed = clock.getElapsedTime();
            let dt = Math.min(elapsed - lastT, 0.1);
            lastT = elapsed;

            if (started && gu.progress.value < 1) {
                gu.progress.value = Math.min(gu.progress.value + dt / EXPLODE_DURATION, 1);
            }

            // Keys / buttons accelerate smoothly; after a drag the model coasts and slows down
            if (!dragging) {
                let keyX = input.down - input.up, keyY = input.right - input.left;
                if (keyX || keyY) {
                    let ease = 1 - Math.exp(-dt * 8);
                    velX += (keyX * ROT_SPEED - velX) * ease;
                    velY += (keyY * ROT_SPEED - velY) * ease;
                } else {
                    let decay = Math.exp(-dt * 2.5);
                    velX *= decay;
                    velY *= decay;
                }
                if (Math.abs(velX) + Math.abs(velY) > 1e-4) rotateModel(velX * dt, velY * dt);
            }

            let t = elapsed * 0.5;
            gu.time.value = t * Math.PI;
            galaxy.rotation.y = -t * 0.08;

            // heartbeat: two quick pulses, then rest
            let beatT = elapsed % 1.4;
            let beat = Math.exp(-Math.pow((beatT - 0.15) * 14, 2)) + 0.6 * Math.exp(-Math.pow((beatT - 0.42) * 14, 2));
            heart.material.uniforms.uBeat.value = 1 + 0.06 * beat;
            // Star portrait morph: the heart / scale / chest are hidden while their dots form the person
            if (portrait) {
                morph.value = THREE.MathUtils.clamp(morph.value + (morphTarget ? 1 : -1) * dt / MORPH_DURATION, 0, 1);
                portrait.visible = morph.value > 0;
                heart.visible = !portrait.visible;
                if (morphTarget && morph.value < 1) { // pull the camera back so the whole portrait fits
                    let off = camera.position.clone().sub(controls.target), L = off.length();
                    if (L < 30) camera.position.copy(controls.target).addScaledVector(off.normalize(), L + (30 - L) * (1 - Math.exp(-dt * 2)));
                }
            }
            // fountain: strong burst while the dots fly, a gentle stream while the portrait is shown
            let wantPower = morph.value > 0 && morph.value < 1 ? 1 : morphTarget ? 0.3 : 0;
            fountainPower += (wantPower - fountainPower) * (1 - Math.exp(-dt * 3));
            fountain.material.uniforms.uPower.value = fountainPower;
            fountain.material.uniforms.uClock.value = elapsed;
            fountain.visible = fountainPower > 0.01;

            // the chest glows and pulses
            let pulse = 0.5 + 0.5 * Math.sin(elapsed * 3);
            chestGlow.material.opacity = (0.55 + 0.45 * pulse) * THREE.MathUtils.smoothstep(gu.progress.value, 0.6, 1);
            chestGlow.scale.setScalar(4.5 + 1.2 * pulse);

            // Spin slows to a stop when zoomed in close (or when paused), so the front stays visible
            let dist = camera.position.distanceTo(controls.target);
            let wantSpin = spinPaused ? 0 : THREE.MathUtils.smoothstep(dist, 10, 18);
            spinFactor += (wantSpin - spinFactor) * (1 - Math.exp(-dt * 3));
            spinAngle += dt * HEART_SPIN * spinFactor;
            heart.rotation.y = spinAngle;
            // Fade the heart shell when close so the scale and chest inside are visible
            heart.material.uniforms.uOpacity.value = 0.2 + 0.8 * THREE.MathUtils.smoothstep(dist, 7, 16);
            beamGroup.rotation.z = 0.1 * Math.sin(elapsed * 0.9);
            for (let pan of pans) pan.rotation.z = -beamGroup.rotation.z;

            // decorations appear in the second half of the explosion
            let d = THREE.MathUtils.smoothstep(gu.progress.value, 0.45, 1);
            decor.scale.setScalar(Math.max(d, 0.001));
            for (let o of orbiters) {
                o.angle += dt * o.speed * (4 / o.r);
                o.sprite.position.set(
                    Math.cos(o.angle) * o.r,
                    o.y + Math.sin(elapsed * 1.2 + o.phase) * o.bob,
                    Math.sin(o.angle) * o.r
                );
                o.sprite.material.opacity = d;
            }

            composer.render();
        });
    </script>
</body>

</html>
